<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Gastos Mensuales</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Gestor de gastos mensuales</h1>
      <p class="subtitle">Registra tus gastos, revisa tu resumen y pide ayuda a la IA.</p>

      <section class="panel">
        <h2>Nuevo Gasto</h2>
        <form id="expense-form" class="form-grid">
          <div class="form-group">
            <label for="description">Descripción</label>
            <input id="description" name="description" type="text" placeholder="Ej: Almuerzo" required />
          </div>
          <div class="form-group">
            <label for="category">Categoría</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Selecciona una categoría</option>
              <option value="Comida">Comida</option>
              <option value="Transporte">Transporte</option>
              <option value="Vivienda">Vivienda</option>
              <option value="Salud">Salud</option>
              <option value="Ocio">Ocio</option>
              <option value="Educación">Educación</option>
              <option value="Otros">Otros</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Cantidad</label>
            <input id="amount" name="amount" type="number" step="0.01" placeholder="0.00" required />
          </div>
          <div class="form-group">
            <label for="date">Fecha</label>
            <input id="date" name="date" type="date" required />
          </div>
          <button type="submit" class="btn-submit">Agregar gasto</button>
        </form>
      </section>

      <section class="panel summary">
        <div class="bank-card">
          <div class="bank-card__header">
            <span>Cuenta principal</span>
            <strong>Saldo del mes</strong>
          </div>
          <div class="summary-cards">
            <article>
              <h2>Total</h2>
              <p id="total">0.00€</p>
            </article>
            <article>
              <h2>Categorías</h2>
              <ul id="categories"></ul>
            </article>
          </div>
        </div>

        <div class="controls">
          <button id="reset-button" type="button">Borrar datos</button>
        </div>
      </section>

      <section class="panel transactions-panel">
        <div class="panel-heading">
          <h2>Movimientos</h2>
          <p id="expenses-empty-state" class="empty-state">No hay gastos para mostrar.</p>
        </div>
        <form id="filters-form" class="controls filters-panel">
          <div class="form-group compact">
            <label for="date-input">Fecha</label>
            <input id="date-input" name="date" type="date" />
          </div>
          <div class="form-group compact">
            <label for="category-filter">Categoría</label>
            <select id="category-filter" name="category">
              <option value="">Todas</option>
            </select>
          </div>
          <button type="submit">Filtrar</button>
          <button id="clear-filters-button" type="button">Reiniciar filtros</button>
        </form>
        <ul id="expenses-list" class="transactions-list"></ul>
      </section>

      <section class="panel">
        <h2>Asistente de IA</h2>
        <input id="api-key" type="password" placeholder="Clave API de OpenAI" />
        <button id="ai-button" type="button">Pedir consejo</button>
        <p id="ai-output" class="ai-output">Pulsa el botón para obtener un análisis breve.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
